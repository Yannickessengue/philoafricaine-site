titre: 'Palabre autour de Jean Godefroy Bidima. Leçons de biopolitique : la démocratie en sursis ?'
date: '2026-10-21'
dateAffichee: 21 octobre 2026
lieu: Collège international de philosophie, Campus Condorcet, Aubervilliers
categorie: journee
format: présentiel et en ligne
presentation: Journée d’étude organisée par le Collège international de philosophie, le Groupe JOGOO et le Conseil Inter-Africain de Philosophie (CIAP) sur l’apport de Jean Godefroy Bidima à la pensée de la biopolitique et de la démocratie. Trois sessions — la palabre comme médiation, droit et réparation ; biopolitique et démocratie en sursis ; traversée, temporalité et critique postcoloniale.
intervenants: Sylvère Mbondobari (conférence inaugurale), Brigitte Nga Ondigui (performance), David-Le-Duc Tiaha, Charles Romain Mbele, Joseph Tonda, Ulrich Metende, Amélie Aristelle Ekassi, Pierre Tchimabi, Yannick Essengue et d’autres
