titre: 'Fabien Eboussi Boulaga. Reprise de soi et décolonisation des savoirs'
date: '2023-05-03'
dateAffichee: 3 – 5 mai 2023
lieu: Université catholique d’Afrique centrale (UCAC), campus de Nkolbisson, Yaoundé
categorie: colloque
format: présentiel et en ligne
presentation: Premier grand colloque consacré à Fabien Eboussi Boulaga, à l’occasion du lancement du Fonds Eboussi Boulaga. Trois journées de keynotes, plénières, panels et ateliers de lecture autour de la reprise de soi, de l’identité, de la critique du christianisme et de la décolonisation des savoirs, avec un panégyrique de Paulin Hountondji et une table ronde « Fabien Eboussi Boulaga en toutes lettres ».
intervenants: Ernest-Marie Mbonda (keynote d’ouverture), Ernst Wolff, Elsa Dorlin, Paulin J. Hountondji, Ambroise Kom, Ebénézer Njoh-Mouelle, Hubert Mono Ndjana, Michel Kouam, Charles Romain Mbele, Kasereka Kavwahirehi, Steve Gaston Bobongaud, Pierre Tchimabi et de nombreux chercheurs d’Afrique et d’ailleurs
