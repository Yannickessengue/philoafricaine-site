titre: 'Journée d’étude : cinquantenaire de l’« Essai sur la problématique philosophique dans l’Afrique actuelle » de Marcien Towa'
date: '2021-04-29'
dateAffichee: Jeudi 29 avril 2021
lieu: Université catholique d’Afrique centrale, campus de Nkolbisson, Yaoundé (Cameroun)
categorie: journee
format: présentiel
presentation: 'Cinquante ans après sa parution (1971), relecture de l’Essai de Marcien Towa : sa critique de l’ethnophilosophie et sa portée aujourd’hui.'
intervenants: 'Keynote : Pr Nkolo Foé ; adresses : Evelyne Towa, Dr Amélie Ekassi ; conférences : Dr Adoulou N. Bitang, Pr Charles Romain Mbele ; modération : Pr Steve Gaston Bobongaud'
