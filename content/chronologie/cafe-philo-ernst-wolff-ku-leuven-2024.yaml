titre: 'Café-philo (africaine) : la philosophie africaine en dialogue(s), autour d’Ernst Wolff'
date: '2024-05-18'
dateAffichee: Samedi 18 mai 2024
lieu: KU Leuven, Institut supérieur de philosophie (Belgique)
categorie: seminaire
format: présentiel et en ligne
presentation: Conversation interdisciplinaire autour du philosophe franco-sud-africain Ernst Wolff (KU Leuven), réunissant de jeunes chercheurs autour des philosophies du Sud en dialogue — traditions philosophiques, devenir de l’Afrique-Monde, dialogue entre pensées africaines et latino-américaines. Modération : Yannick Essengue.
intervenants: Ernst Wolff, Lina Álvarez Villarreal, Elom Kodjo M’Blasso, Georges Mizingi, Jean René Mabwilo, Josué Mbeutcha, Kamto Fotso, Marcel Efoudebe, Robby Mandiangu
