titre: Grande conférence publique « Philosophie africaine aujourd’hui » et lancement du site philoafricaine.com
date: '2014-05-14'
dateAffichee: Mercredi 14 mai 2014
lieu: Goethe-Institut, Cocody, Abidjan (Côte d’Ivoire)
categorie: conference
format: présentiel
presentation: 'Avec le Groupe de Recherche et d’Échanges Philosophiques (GREPh), première grande sortie publique du groupe : conférence sur la philosophie africaine aujourd’hui, suivie du lancement officiel du site web.'
intervenants: Pr Biaka Zasseli Ignace (« Quelle pédagogie pour une praxis de la philosophie ? ») ; Pr Boa Thiémélé Ramsès (« Internet et renaissance philosophique africaine ») ; Yannick Essengue (présentation du site)
