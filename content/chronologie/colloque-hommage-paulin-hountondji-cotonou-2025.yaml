titre: Colloque international « Hommage à Paulin J. Hountondji »
date: '2025-02-03'
dateAffichee: 3 – 5 février 2025
lieu: Cotonou (Bénin)
categorie: colloque
format: présentiel
presentation: 'Trois jours d’hommage à Paulin Jidénu Hountondji (1942-2024), organisés en collaboration par l’Université Toulouse – Jean Jaurès (séminaire SCREAF), le Groupe JOGOO et un réseau de partenaires : Académie nationale des sciences, arts et lettres du Bénin, Collège international de philosophie, ENS, NYU, Université Paris 1 Panthéon-Sorbonne, Sciences Po, UM6P, Université Paris Nanterre, entre autres. Toutes les informations : https://screaf.univ-tlse2.fr/accueil/seminaire/seminaire-2024-2025/colloque-hommage-paulin-hountondji'
intervenants: 'Organisateurs : Paul Christian Kiti, Yannick Essengue, Nathanaël Soédé'
