presentation: 'Avec le CIAP, le CEFOD et l’Université de N’Djamena. Keynote inaugurale, deux panels (« Panser le social » ; « Penser le politique et le dialogue interreligieux ») et table ronde à Radio CEFOD : « Religions, société et paix : quelles responsabilités aujourd’hui ? »'
intervenants: 'Organisation : Mathurin Mbadbe (Université de N’Djamena), Ramadane Djague (ITCJ, Abidjan), Yannick Essengue (Université Jean Jaurès) ; coordination scientifique : Pr Christophe Loajembe (Université de N’Djamena)'
