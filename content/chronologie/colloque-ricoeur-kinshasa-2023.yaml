titre: 'Mémoires blessées, promesses inachevées. La pensée de Ricœur et les horizons africains'
date: '2023-04-25'
dateAffichee: 25 – 27 avril 2023
lieu: Institut français de Kinshasa (RD Congo)
categorie: colloque
format: présentiel et en ligne
presentation: Colloque interdisciplinaire international né d’une initiative du Fonds Ricœur (EHESS, Paris). Trois journées construites sur le triptyque de La mémoire, l’histoire, l’oubli — « le conflit des mémoires », « des mémoires à l’histoire, et retour », « oubli, réparation, promesses inachevées » — réunissant philosophes, historiens, juristes, théologiens, artistes et praticiens, avec une exposition (Steve Bandoma, Rachel Malaika, Falonne Mambu, Freddy Tsimba), une soirée de projection de films de Thierry Michel et Dieudo Hamadi, et une soirée rumba.
intervenants: Olivier Abel, Léon Matangila Musadila, Ernst Wolff, Jean-Godefroy Bidima, Isidore Ndaywel è Nziem, Sabina Loriga, Steve Gaston Bobongaud, Corinne Fleury, Fabienne Brugère, André Yoka Lye, David-Le-Duc Tiaha, Emmanuel Banywesize, Yannick Essengue et de nombreux chercheurs africains et européens
