titre: 'Le tournant épistémologique de la philosophie africaine. Acte IV : philosophie africaine du langage'
date: '2026-02-18'
dateAffichee: 18 février 2026
lieu: Université Loyola du Congo, Kinshasa (RD Congo)
categorie: journee
format: présentiel et en ligne
presentation: Quatrième acte du cycle « Le tournant épistémologique de la philosophie africaine », consacré au langage — langues africaines, oralité, traduction, discours et contextes de signification — avec un hommage au professeur Kinyongo Jeki.
intervenants: Christian Kanzian (keynote lecture), Benoît Okolo Okonda, Yaovi Akakpo, Souleymane Bachir Diagne, Mahamadé Savadogo, Elie Ngoma-Binda, Emmanuel Banywesize, Jean-René Mabwilo et d’autres
