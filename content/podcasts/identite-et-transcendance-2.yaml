description: 'L’homme purement créateur n’existe nulle part : chacun est façonné par une culture, une langue, une époque. Créer, c’est partir d’une tradition pour en engendrer une autre.'
source: Identité et transcendance, Paris, L’Harmattan, 2011, p. 291.
