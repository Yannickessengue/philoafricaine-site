description: Le débat sur la philosophie africaine s’est longtemps enfermé dans la question de sa propre existence. Towa propose de la reprendre à la base, en jugeant la philosophie européenne en elle-même.
source: Essai sur la problématique philosophique dans l’Afrique actuelle, Yaoundé, Clé, 1971.
