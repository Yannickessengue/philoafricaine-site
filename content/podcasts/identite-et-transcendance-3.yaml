description: 'Rien dans une culture particulière n’est intangible : au nom de l’identité humaine générique, Towa appelle à une Afrique qui porte en elle-même son centre de conception, de décision et de réalisation.'
source: Identité et transcendance, Paris, L’Harmattan, 2011, p. 342.
